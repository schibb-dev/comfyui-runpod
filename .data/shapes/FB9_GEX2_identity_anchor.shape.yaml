# GEX2 extend plate with a still that drives Wan CLIP-vision identity.
# Based on high-rated extend job
#   hourly__prompt_profile-6ec23767562b__source_video-FB9_GEX2_FACIAL_2026-05-11_00004__000_202607140554
# (all axes 5★ + fast_track).
#
# Wiring:
#   - source_video → VHS_LoadVideoPath #377 (chain / extend input)
#   - identity_anchor → LoadImage #500 → ImageScale #501 → CLIPVisionEncode #130
#   - WanImageToVideo start_image still from source_video last frame (temporal continuity)
#   - prompt_profile → positive #380 / negative #17 (same as GEX2)

requires:
  - slot: source_video
    role: B
    media: video
    binding:
      type: vhs_load_video_path
      node_id: 377
      field: video

  - slot: identity_anchor
    role: A
    media: image
    binding:
      type: load_image
      node_id: 500
      field: image

  - slot: prompt_profile
    role: C
    media: text
    binding:
      type: prompt_bundle
      positive: { node_id: 380, widget_index: 0 }
      negative: { node_id: 17, widget_index: 0 }

produces:
  - slot: final_video
    role: X
    media: video
    binding:
      node_id: 80
      node_type: VHS_VideoCombine

deposits:
  final_video:
    to_pool: pool:FB9_GEX2_identity_anchor_X_og

output_prefix_root: og/%date:yyyy-MM-dd%/FB9_GEX2_identity_anchor_shape

postprocess:
  profile_id: gex-identity-anchor
  color_match: false
  merge_frames: true

rules: []
