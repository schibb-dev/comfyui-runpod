schema_version: comfyui-runpod.pools.v0
shape: /home/yuji/src/comfyui-runpod/.data/shapes/FB9_GEX.shape.yaml

pools:
  source_video:
    slot: source_video
    description: >
      FB9_GEX clips plus image-started deposits (BounceDanceA, FaceBlast, Kneel)
      and 2025-era OG library. Excludes GEX2/FACIAL naming via date-prefixed GEX globs.
    members:
      - glob: /home/yuji/comfyui-runpod-data/output/og/**/FB9_GEX_2026-*.mp4
        limit: 400
      - glob: /home/yuji/comfyui-runpod-data/output/og/**/FB9_GEX_shape/**/*.mp4
        limit: 200
      # Image→GEX chain sources (hourly bind also pins an exact path).
      - glob: /home/yuji/comfyui-runpod-data/output/og/**/*BounceDanceA*.mp4
        limit: 300
      - glob: /home/yuji/comfyui-runpod-data/output/og/**/*FaceBlast*.mp4
        limit: 300
      - glob: /home/yuji/comfyui-runpod-data/output/og/**/X-Kneel-FB9-*.mp4
        limit: 400
      - glob: /home/yuji/comfyui-runpod-data/input/**/X-Kneel*.mp4
        limit: 100
      # 2025-era OG library (hourly biases toward these for first-hop / extend variety).
      - glob: /home/yuji/comfyui-runpod-data/output/og/2025-*/*.mp4
        limit: 300

  prompt_profile:
    slot: prompt_profile
    description: Prompt bundles (C slot)
    members:
      - dir: /workspace/.data/pools/FB9_GEX/prompts
        ext: [".json"]

deposit_pools:
  FB9_GEX_X_og:
    slot: final_video
    description: FB9_GEX shape_factory outputs (final_video)
    seed_members:
      - glob: /home/yuji/comfyui-runpod-data/output/og/**/FB9_GEX_2026-*.mp4
        limit: 400
      - glob: /home/yuji/comfyui-runpod-data/output/og/**/FB9_GEX_shape/**/*.mp4
        limit: 200
