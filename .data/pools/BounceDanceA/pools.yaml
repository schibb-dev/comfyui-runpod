schema_version: comfyui-runpod.pools.v0
shape: /home/yuji/src/comfyui-runpod/.data/shapes/BounceDanceA.shape.yaml

pools:
  source_still:
    slot: source_still
    description: >
      Start frames (A slot). Prefer newest Comfy input drops — BounceDance hourly
      strongly biases to fresh stills (catalog first_seen / mtime). Comfy LoadImage
      only accepts files under input/, so do not pool output/og companion PNGs here.
    members:
      - glob: /home/yuji/comfyui-runpod-data/input/**/*.png
        sort: mtime_desc
        limit: 80
      - glob: /home/yuji/comfyui-runpod-data/input/**/*.jpeg
        sort: mtime_desc
        limit: 80
      - glob: /home/yuji/comfyui-runpod-data/input/**/*.jpg
        sort: mtime_desc
        limit: 80
      - glob: /home/yuji/comfyui-runpod-data/input/**/*.webp
        sort: mtime_desc
        limit: 40

  prompt_profile:
    slot: prompt_profile
    description: Prompt bundles (C slot)
    members:
      - dir: /workspace/.data/pools/BounceDanceA/prompts
        ext: [".json"]

deposit_pools:
  BounceDanceA_X_og:
    slot: final_video
    description: BounceDanceA shape_factory outputs (final_video)
    seed_members:
      - glob: /home/yuji/comfyui-runpod-data/output/og/**/BounceDanceA*.mp4
        limit: 200
      - glob: /home/yuji/comfyui-runpod-data/output/og/**/BounceDanceA_shape/**/*.mp4
        limit: 200
