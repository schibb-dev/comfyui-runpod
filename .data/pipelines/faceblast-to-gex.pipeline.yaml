schema_version: comfyui-runpod.pipeline.v0
pipeline_id: faceblast-to-gex
description: FB9-FaceBlast deposit → FB9_GEX (hourly i2v→GEX chain; Workbench Extend default)
input_guidance: still
affinity:
  - when: still_seed_to_gex

steps:
  - id: faceblast
    shape: /home/yuji/src/comfyui-runpod/.data/shapes/FB9-FaceBlast.shape.yaml
    pools: /home/yuji/src/comfyui-runpod/.data/pools/FB9-FaceBlast/pools.yaml
    pick: zip
    deposits:
      final_video: pool:FB9-FaceBlast_X_og

  - id: gex
    shape: /home/yuji/src/comfyui-runpod/.data/shapes/FB9_GEX.shape.yaml
    pools: /home/yuji/src/comfyui-runpod/.data/pools/FB9_GEX/pools.yaml
    pick: zip
    binds_override:
      source_video:
        from: pool
        pool: FB9-FaceBlast_X_og
        pick: last
        index: /home/yuji/src/comfyui-runpod/.data/pools/FB9-FaceBlast/index.json
      prompt_profile:
        from: path
        path: /home/yuji/src/comfyui-runpod/.data/pools/FB9_GEX/prompts/catalog-faceblast-extend.json
    deposits:
      final_video: pool:FB9_GEX_X_og

rules: []
