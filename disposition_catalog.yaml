# Disposition catalog — entry markers route into process steps / reasons.
# Runtime edits merge into output/.../_status/disposition_catalog.json (UI/API).
#
# kind: entry | step | reason
# reason: diagnosis under an entry (e.g. refine) — optional modifiers, no hooks
# hook: none | replay | replay_front | extend | open_trim | trash | archive |
#       extract_frame | sampler_pin | appetite_more | set_marker
# modifier_mode: none | exclusive | multi
#
version: 1
schema: comfyui-runpod.disposition-catalog.v0

promotion_rules:
  high_quality_high_appetite:
    quality_min: 4
    appetite_in: [more, fast_track]
    promote: [advance]
    secondary: []
  low_quality_high_appetite:
    quality_max: 3
    appetite_in: [more, fast_track]
    promote: [refine, investigate]
    secondary: []
  low_quality_low_appetite:
    quality_max: 2
    appetite_in: [less, neutral]
    promote: [retire]
    secondary: []
  high_quality_low_appetite:
    quality_min: 4
    appetite_in: [less, neutral]
    promote: [retire]
    secondary: []
  fast_track:
    appetite_in: [fast_track]
    promote: [advance]
    secondary: [refine]
  conflicting_signals:
    appetite_in: [more, fast_track]
    quality_max: 3
    predicted_max: 2.5
    promote: [investigate]
    secondary: [refine]

markers:
  - id: refine
    kind: entry
    process: refine
    label: Refine
    hint: Known fix — mark why, then act later
    enabled: true
    order: 1
    hook: none
    narrows_to:
      - refine.identity
      - refine.lighting
      - refine.pacing
      - refine.activity
      - refine.artifacts
      - refine.malformations
      - refine.intruders
      - refine.other
    promote_when: [low_quality_high_appetite]

  - id: investigate
    kind: entry
    process: investigate
    label: Investigate
    hint: Needs a closer look before routing
    enabled: true
    order: 2
    hook: none
    narrows_to: []
    promote_when: [conflicting_signals, low_quality_high_appetite]

  - id: advance
    kind: entry
    process: advance
    label: Advance
    hint: Feed the next pipeline stage
    enabled: true
    order: 3
    hook: none
    narrows_to: [advance.extend, advance.vary]
    promote_when: [high_quality_high_appetite, fast_track]

  - id: retire
    kind: entry
    process: retire
    label: Retire
    hint: Soft-archive out of active work
    enabled: true
    order: 4
    hook: none
    narrows_to: [retire.trash, retire.archive]
    promote_when: [low_quality_low_appetite, high_quality_low_appetite]

  - id: park
    kind: entry
    process: park
    label: Re-evaluate later
    hint: Park for a future pass
    enabled: true
    order: 5
    hook: sampler_pin
    promote_when: []

  - id: refine.identity
    kind: reason
    process: refine
    label: Identity
    hint: Wrong subject / who-what / character drift
    enabled: true
    order: 10
    modifier_mode: none

  - id: refine.lighting
    kind: reason
    process: refine
    label: Lighting
    hint: Light, exposure, shadows, color of light
    enabled: true
    order: 11
    modifier_mode: multi
    modifiers:
      - { id: dark, label: Dark }
      - { id: bright, label: Bright }
      - { id: flat, label: Flat }
      - { id: harsh, label: Harsh }
      - { id: warm, label: Warm }
      - { id: cool, label: Cool }
      - { id: bad_shadows, label: Bad shadows }

  - id: refine.pacing
    kind: reason
    process: refine
    label: Pacing
    hint: Length, loop, cut points, tempo
    enabled: true
    order: 12
    modifier_mode: exclusive
    modifiers:
      - { id: too_fast, label: Too fast }
      - { id: too_slow, label: Too slow }
      - { id: too_variable, label: Too variable }

  - id: refine.activity
    kind: reason
    process: refine
    label: Activity
    hint: Motion energy is wrong
    enabled: true
    order: 13
    modifier_mode: exclusive
    modifiers:
      - { id: too_busy, label: Too busy }
      - { id: too_still, label: Too still }

  - id: refine.artifacts
    kind: reason
    process: refine
    label: Artifacts
    hint: Glitches, mush, warping
    enabled: true
    order: 14
    modifier_mode: none

  - id: refine.intruders
    kind: reason
    process: refine
    label: Intruders
    hint: Unwanted people, objects, or junk in frame
    enabled: true
    order: 15
    modifier_mode: none

  - id: refine.other
    kind: reason
    process: refine
    label: Other
    hint: Something else — leave a short note
    enabled: true
    order: 16
    modifier_mode: none
    requires_note: true

  - id: advance.extend
    kind: step
    process: advance
    label: Extend
    hint: Chain output into video slot
    enabled: true
    order: 40
    hook: extend

  - id: advance.vary
    kind: step
    process: advance
    label: Vary
    hint: Front-queue replay with the same bindings
    enabled: true
    order: 41
    hook: replay_front

  - id: retire.trash
    kind: step
    process: retire
    label: Trash
    hint: Move to og/_trash
    enabled: true
    order: 50
    hook: trash

  - id: retire.archive
    kind: step
    process: retire
    label: Archive
    hint: Soft retire
    enabled: true
    order: 51
    hook: archive
