# SFTP with read/write access: two top-level folders — `input` and `output` — mounted from the host (same defaults as ComfyUI binds).
# Optional overrides: OUTPUT_SFTP_INPUT_DIR / OUTPUT_SFTP_OUTPUT_DIR. Falls back to COMFYUI_BIND_INPUT_DIR / COMFYUI_BIND_OUTPUT_DIR.
# Do not use : in OUTPUT_SFTP_PASSWORD (atmoz/sftp command format).
#
# To add more top-level folders later (e.g. workflows): add another volume under /home/sftpuser/<name> and append :<name>
# to the command list (atmoz/sftp user:pass:uid:gid:dir1:dir2:...).
#
# Standalone:
#   docker compose -f docker-compose.output-sftp.yml up -d
# With the main stack on boot (Linux/WSL systemd), see scripts/install-systemd-boot.sh.
#
# Set OUTPUT_SFTP_PASSWORD in .env (see .env.example). Default here is only a dev placeholder.
#
# Stable SSH host key fingerprint: keys live on the host (default ./.data/output-sftp-ssh-hostkeys).
# Generate once (idempotent): npm run sftp:init-hostkeys  OR  scripts/init_output_sftp_ssh_hostkeys.sh
# Optional: OUTPUT_SFTP_SSH_HOSTKEYS_DIR=/path/to/dir — same dir must hold ssh_host_ed25519_key(.pub) and ssh_host_rsa_key(.pub)
# We mount individual key files so /etc/ssh/sshd_config from the image is not replaced by an empty volume.

services:
  output-sftp:
    image: atmoz/sftp:alpine
    container_name: output-sftp
    # Same as comfyui: no auto-restart on daemon boot (WSL bind-mount race). See install-systemd-boot.sh.
    restart: "no"
    ports:
      - "${OUTPUT_SFTP_PORT:-2222}:22"
    volumes:
      - "${OUTPUT_SFTP_SSH_HOSTKEYS_DIR:-./.data/output-sftp-ssh-hostkeys}/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro"
      - "${OUTPUT_SFTP_SSH_HOSTKEYS_DIR:-./.data/output-sftp-ssh-hostkeys}/ssh_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub:ro"
      - "${OUTPUT_SFTP_SSH_HOSTKEYS_DIR:-./.data/output-sftp-ssh-hostkeys}/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key:ro"
      - "${OUTPUT_SFTP_SSH_HOSTKEYS_DIR:-./.data/output-sftp-ssh-hostkeys}/ssh_host_rsa_key.pub:/etc/ssh/ssh_host_rsa_key.pub:ro"
      - "${OUTPUT_SFTP_INPUT_DIR:-${COMFYUI_BIND_INPUT_DIR:-./workspace/input}}:/home/sftpuser/input"
      - "${OUTPUT_SFTP_OUTPUT_DIR:-${COMFYUI_BIND_OUTPUT_DIR:-./workspace/output}}:/home/sftpuser/output"
    # user:pass:uid:gid:dir1:dir2 — chrooted under /home/sftpuser; each name is a top-level SFTP folder.
    # Keep uid:gid in sync with COMFYUI_RUN_UID / COMFYUI_RUN_GID (ComfyUI drops to that user for writes).
    command: "sftpuser:${OUTPUT_SFTP_PASSWORD:-changeme}:${COMFYUI_RUN_UID:-1000}:${COMFYUI_RUN_GID:-1000}:input:output"
