site_name: comfyui-runpod planning
site_description: Design notes, programs, and implementation plans
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode

plugins:
  - search
  - mermaid2

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true

extra_css:
  - stylesheets/print.css

nav:
  - Planning hub: plans/README.md
  - Programs:
    - A1 Discovery: plans/a1-discovery.md
    - A2 Experimentation: plans/a2-experimentation.md
    - A3 Refinement: plans/a3-refinement.md
    - Hourly drain policy: plans/a3-hourly-drain-policy.md
    - A4 Production: plans/a4-production.md
    - S1 Custody: plans/s1-custody.md
    - S2 Platform: plans/s2-platform.md
    - Asset galleries: plans/asset-gallery.md
    - Judgment: plans/judgment.md
  - Archive:
    - Archive README: plans/archive/README.md
    - Current ↔ archive MAP: plans/archive/MAP.md
  - Reference:
    - All docs index: INDEX.md
    - Bucket model: DISPOSITION_BUCKET_MODEL.md
    - Clips model: CLIP_SELECTION_MODEL.md
    - Corpus lifecycle: CORPUS_LIFECYCLE.md
    - Workflow intent: WORKFLOW_INTENT.md
    - Factory MCP: FACTORY_MCP.md
    - Queue & jobs: SCHEDULED_AND_CONTAINER_JOBS_RUNDOWN.md
    - Workspace & resubmit: WORKSPACE_PROJECTS_RUNDOWN.md
    - Workflow compatibility: WORKFLOW_COMPATIBILITY.md
    - Output path mitigation: OUTPUT_PATH_MITIGATION.md
    - Check-in strategy: CHECKIN_STRATEGY.md
    - Experiments UI API concurrency: EXPERIMENTS_UI_API_CONCURRENCY.md
    - Krita AI setup: KRITA_AI_SETUP.md
    - WSL move follow-up: WSL_MOVE_TO_E_FOLLOWUP.md
    - Cursor agent sudo: CURSOR_AGENT_SUDO_ASKPASS.md
    - RDP Ubuntu setup: RDP_UBUNTU_SETUP.md
